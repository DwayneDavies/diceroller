<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dice Roller</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-dark">
  <script>
    // Apply the saved theme before the page first paints, so it doesn't
    // flash the default theme on load. js/settings.js takes over after this.
    try {
      var savedTheme = JSON.parse(localStorage.getItem("theme"));
      if (["dark", "parchment", "neon"].indexOf(savedTheme) >= 0) {
        document.body.className = "theme-" + savedTheme;
      }
    } catch (e) {}
  </script>

  <h1>🎲 Dice Roller</h1>

  <!-- Gear icon -->
  <button type="button" id="settings-gear" class="gear-icon" aria-label="Settings" title="Settings">⚙️</button>

  <!-- Dice Buttons Collapsible -->
  <details open>
    <summary>Dice Buttons</summary>
    <div class="dice-row">
      <button class="dice-btn d3" data-sides="3" title="d3">d3</button>
      <button class="dice-btn d4" data-sides="4" title="d4">d4</button>
      <button class="dice-btn d6" data-sides="6" title="d6">d6</button>
      <button class="dice-btn d8" data-sides="8" title="d8">d8</button>
      <button class="dice-btn d10" data-sides="10" title="d10">d10</button>
      <button class="dice-btn d12" data-sides="12" title="d12">d12</button>
      <button class="dice-btn d20" data-sides="20" title="d20">d20</button>
      <button class="dice-btn d100" data-sides="100" title="d100">d100</button>
    </div>
  </details>

  <!-- Preset Action Buttons Collapsible -->
  <details open>
    <summary>Preset Actions</summary>
    <div class="d20-modifiers input-group">
      <label>Attack mod: <input type="number" id="mod-attack" value="0"></label>
      <label>Initiative mod: <input type="number" id="mod-initiative" value="0"></label>
      <label>Save mod: <input type="number" id="mod-saving" value="0"></label>
      <label>Advantage mod: <input type="number" id="mod-advantage" value="0"></label>
      <label>Disadvantage mod: <input type="number" id="mod-disadvantage" value="0"></label>
    </div>
    <div class="preset-row">
      <button class="preset-btn advantage" onclick="rollAdvantage()">Advantage</button>
      <button class="preset-btn disadvantage" onclick="rollDisadvantage()">Disadvantage</button>
      <button class="preset-btn ability" onclick="rollAbilityScore()">Ability Score</button>
      <button class="preset-btn initiative" onclick="rollInitiative()">Initiative</button>
      <button class="preset-btn attack" onclick="rollAttack()">Attack</button>
      <button class="preset-btn saving" onclick="rollSavingThrow()">Saving Throw</button>
      <!-- Custom presets will be injected here -->
    </div>
  </details>

  <!-- Results Log -->
  <div id="results"></div>
  <p id="copy-last-hint" class="copy-last-hint hidden">Last roll copied to clipboard.</p>

  <!-- Custom context menu -->
  <ul id="results-menu" class="context-menu">
    <li id="copy-last-roll">Copy last roll</li>
    <li id="clear-results">Clear Results</li>
  </ul>

  <!-- Custom Roll -->
  <details>
    <summary>Custom Roll (xdy + z)</summary>
    <div class="input-group">
      <label>Times (x): <input type="number" id="times" min="1" max="100" value="1"></label>
      <label>Sides (y): <input type="number" id="sides" min="2" max="1000" value="6"></label>
      <label>Modifier (z): <input type="number" id="mod" min="-100" max="100" value="0"></label>
    </div>
    <button onclick="customRoll(event)">Roll Custom</button>
  </details>

  <!-- Find Roll Stats -->
  <details>
    <summary>Find Roll Stats (xdy + z)</summary>
    <div class="input-group">
      <label>Times (x): <input type="number" id="stat-times" min="1" max="100" value="1"></label>
      <label>Sides (y): <input type="number" id="stat-sides" min="2" max="1000" value="6"></label>
      <label>Modifier (z): <input type="number" id="stat-mod" min="-100" max="100" value="0"></label>
    </div>
    <button onclick="findRollStats(event)">Find Stats</button>
    <div id="stats-container">
      <div id="stats-summary"></div>
      <canvas id="stats-chart"></canvas>
    </div>
  </details>

  <!-- Settings Popup Modal -->
  <div id="settings-popup" class="settings-popup hidden">
    <div class="settings-content">
      <h2>Settings</h2>
      <button type="button" id="close-settings" class="close-btn" aria-label="Close settings">✕</button>

      <!-- Preset Editor -->
      <h3>Preset Editor</h3>
      <div class="input-group">
        <label>Name: <input type="text" id="preset-name"></label>
        <label>Times (x): <input type="number" id="preset-times" min="1" max="100" value="1"></label>
        <label>Sides (y): <input type="number" id="preset-sides" min="2" max="1000" value="6"></label>
        <label>Modifier (z): <input type="number" id="preset-mod" min="-100" max="100" value="0"></label>
      </div>
      <button onclick="addPreset()">Add Preset</button>
      <button onclick="clearPresets()">Clear All Presets</button>

      <!-- General Settings -->
      <h3>General Settings</h3>
      <label><input type="checkbox" id="sound-toggle"> Enable Sounds</label>
      <label>Theme:
        <select id="theme-select">
          <option value="dark">Dark</option>
          <option value="parchment">Parchment</option>
          <option value="neon">Neon</option>
        </select>
      </label>
      <label><input type="checkbox" id="percent-toggle"> Show Percentages in Stats</label>

      <!-- Display Options -->
      <h3>Display Options</h3>
      <label><input type="radio" name="display-mode" value="both" checked> Show Both</label>
      <label><input type="radio" name="display-mode" value="dice"> Dice Only</label>
      <label><input type="radio" name="display-mode" value="presets"> Presets Only</label>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
